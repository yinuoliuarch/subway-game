<html lang="en">
<head>

<style>
:root{--ink:#efe6d2;--dim:#8f8c80;--red:#ee352e;--grey:#a7a9ac;--green:#62d26f;--amber:#f2b84b;--H:min(calc((100vw - 24px) / 2.4), calc(100vh - 190px))}

.ov{position:absolute}.pe{pointer-events:none}

#nosvc{position:absolute;left:68%;top:1%;width:28%;height:4.4%;background:#26313f;color:#ff6b5e;font-size:clamp(8px,.85vw,11px);font-weight:700;display:none;align-items:center;justify-content:flex-end}
.hot{position:absolute;cursor:pointer}

#pop .tbar{height:8px;background:#333;margin-top:12px}#pop .tbar i{display:block;height:100%;background:var(--amber);width:100%}
#pop .tl{font-size:11px;color:var(--dim);margin-top:4px}
#full{position:absolute;inset:0;background:rgba(8,9,11,.95);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}

#full h1{margin:0 0 6px;font-size:22px}#full h2{margin:16px 0 6px;font-size:13px;color:var(--amber);letter-spacing:2px}
.cmp{display:flex;gap:12px}.cmp>div{flex:1;border:2px solid #3a3f47;padding:10px;text-align:center}
.cmp .n{font-size:28px;font-weight:700}
.late{color:#ff6b5e}.ontime{color:var(--green)}.small{font-size:12px;color:var(--dim)}
.go2{display:block;width:100%;margin-top:12px;padding:12px;background:var(--amber);color:#111;font-size:15px}
.go2.alt{background:#2d3238;color:var(--ink)}
#coach{position:absolute;inset:0;z-index:40;display:none}
#hole{position:absolute;border:3px solid var(--amber);box-shadow:0 0 0 9999px rgba(0,0,0,.72);transition:all .3s;pointer-events:none}
#bub{position:absolute;width:310px;background:#17191d;border:3px solid var(--amber);padding:12px 14px;font-size:13px;line-height:1.55}
#bub .k{color:var(--amber);font-size:11px;margin-bottom:4px}
#bub .row{display:flex;justify-content:space-between;margin-top:10px;gap:6px}
#bub button{font-size:12px;background:#2d3238;color:var(--ink);border:2px solid #444;padding:5px 9px}
#bub button.hotb{background:var(--amber);color:#111;border-color:#000}
</style>
</head>

<div id="game">
 <div id="strip"><div id="stripTitle">L → transfer at 14 St → 1/2/3 uptown</div><div id="stripNote"></div><div id="me"></div></div>

<script>
// Data: MTA Subway Schedules 2026 (Wed 2026-08-12) · MTA Service Alerts Oct 2025–Sep 2026 (where/what) · NYC 311 rat complaints · MTA hourly ridership.
const T=(h,m,s=0)=>h*3600+m*60+s;
const START=T(14,50),DEADLINE=T(15,30),HARD=T(15,50),DWELL=30,GOOGLE=T(15,28);
const STRIP=[['1 Av','L'],['3 Av','L'],['Union Sq','L'],['14 St','X'],['18 St'],['23 St'],['28 St'],['34 St','X'],['Times Sq','X'],['50 St'],['59 St'],['66 St'],['72 St','X'],['79 St'],['86 St'],['96 St','X'],['103 St'],['110 St'],['116 St','D']];
const L_STOPS=[['1 Av',0,0],['3 Av',60,1],['14 St–Union Sq',120,2],['6 Av (to 14 St 1/2/3)',210,3]];
const LOCAL=[['14 St',0,3],['18 St',1,4],['23 St',2,5],['28 St',3.5,6],['34 St–Penn',4.5,7],['Times Sq–42 St',6.5,8],['50 St',8.5,9],['59 St–Columbus Circle',10,10],['66 St–Lincoln Center',11.5,11],['72 St',13,12],['79 St',14.5,13],['86 St',16,14],['96 St',18.5,15],['103 St',20,16],['110 St–Cathedral Pkwy',21,17],['116 St–Columbia',22,18]];
const EXPR=[['14 St',0,3],['34 St–Penn',2.5,7],['Times Sq–42 St',4,8],['72 St',8.5,12],['96 St',11.5,15],['110 St–Central Park North',16.5,15.9]];
const XSTOP=new Set(['14 St','34 St–Penn','Times Sq–42 St','72 St','96 St']);
const CROWDED=new Set(['14 St','Times Sq–42 St','34 St–Penn','96 St','1 Av']);
const EV={'3 Av':{m:2,p:2,t:12,s:1},'14 St–Union Sq':{m:8,p:6,t:9,s:2},'18 St':{t:8},'23 St':{m:1,p:2,t:6,s:1},'28 St':{m:2,p:2,t:7},'34 St–Penn':{m:21,p:17,t:29,s:2},'Times Sq–42 St':{m:27,p:37,t:71,s:9},'50 St':{m:4,p:2,t:13},'59 St–Columbus Circle':{m:4,p:11,t:11,s:1},'66 St–Lincoln Center':{p:2,t:5},'72 St':{m:15,p:11,t:44,s:2},'79 St':{m:2,p:1,t:13,s:1},'86 St':{m:4,p:5,t:6,s:2},'96 St':{m:30,p:41,t:58,s:15},'103 St':{m:3,p:1,t:10,s:2},'110 St–Cathedral Pkwy':{m:4,p:13,t:20,s:3}};
const EVNAME={m:'medical emergency',p:'police / disruptive person',t:'train problem',s:'signal problem'};
const EVTXT={m:'We have a customer who needs medical help at this station. Please stand by.',p:'NYPD is responding to a disruptive person. We are holding here.',t:'We are holding while crews fix a door problem on this train.',s:'Signal problem ahead. We are being held in the tunnel.'};
const RAT={'72 St':.3,'96 St':.22,'110 St–Cathedral Pkwy':.15};
const DELAY_P=.30;
const READING=['In October 1904, New York opened its first subway line: from City Hall, past Grand Central and Times Square, then up Broadway to 145th Street. The uptown stretch of today\'s 1 train is part of that original line.','New York is one of the few systems with four tracks: two in the middle for express trains, two outside for locals. That is why many express stops let you switch trains just by crossing the platform.','Express is not always faster. Locals run about every 6 minutes. If your express reaches the transfer station just after a local leaves, all the time you saved is spent waiting.'];
const QUIZ=[['When did New York\'s first subway line open?',['1904','1925','1898'],0],['Why can you often switch express/local on the same platform?',['Four tracks: both stop side by side','They are the same train','The platforms are extra long'],0],['What can happen to the time you save on an express?',['You lose it waiting for the local','You always keep all of it','It makes the local faster'],0]];
const DUR={download:2.5,read:6,submit:1.5,send:1.2};
let G,trains;
const $=id=>document.getElementById(id);
const hm=t=>{if(!isFinite(t))return '—';t=Math.floor(t);let h=Math.floor(t/3600)%12||12;return h+':'+String(Math.floor(t%3600/60)).padStart(2,'0')};
const wpick=o=>{const e=Object.entries(o).filter(([k,v])=>v>0);let r=Math.random()*e.reduce((a,[,v])=>a+v,0);for(const [k,v] of e){r-=v;if(r<0)return k}return e[0][0]};
const tname=tr=>tr.line==='L'?'L train':tr.line+' '+(tr.type==='express'?'Express':'Local');
function mk(line,type,dep0,stops){return {id:line+'_'+dep0,line,type,stops:stops.map(([n,o,si])=>{const dep=dep0+(type==='L'?o:o*60);return {name:n,si,arr:dep-DWELL,dep}}),rolled:false,ev:null}}
function build(){const ts=[];
 [T(14,45,30),T(14,53,30),T(15,1,30),T(15,9,30),T(15,17,30),T(15,25,30)].forEach(d=>ts.push(mk('L','L',d,L_STOPS)));
 for(let k=-3;k<=8;k++)ts.push(mk('1','local',T(15,0)+k*360,LOCAL));
 [[T(14,51),'3'],[T(14,55,30),'2'],[T(14,59),'3'],[T(15,3,30),'2'],[T(15,7),'3'],[T(15,11,30),'2'],[T(15,14,30),'3'],[T(15,19),'2'],[T(15,22,30),'3'],[T(15,27),'2'],[T(15,30,30),'3'],[T(15,35),'2']].forEach(([d,l])=>ts.push(mk(l,'express',d,EXPR)));
 return ts}
function newGame(){
 trains=build();
 G={now:START,paused:true,modal:false,mode:'platform',station:'1 Av',stationSi:0,train:null,walkUntil:0,walkTo:null,
  dl:false,parts:0,answers:[null,null,null],submitted:false,submitAt:null,quizDeadline:null,

  queue:[{t:T(15,4),kind:'chat',text:'Where are you? Prof is already here.'},{t:T(15,8),kind:'mail',text:'Today\'s quiz is now due at 3:25 PM. No late submissions.'}],
  unread:{msg:1,mail:1},mapsSeen:0,usedEv:new Set(),action:null,ratWall:0,crowd:false,crowdDone:false,rat:null,evs:[],slowUntil:0,reported:0,
  letGo:[],present:new Set(),asked:new Set(),firstTask:null,done:[],partsAtQuiz:null,platformNet:0,rodeExpress:false,transfers:0,prevLine:null,
  lastKey:'',app:null,openedMaps:false,overshoot:false,arrival:null,ended:false,rk:''};
 drawStrip();render(true);intro();
}
// ---- schedule helpers ----
function tp(tr){const st=tr.stops;for(let i=0;i<st.length;i++){if(G.now<st[i].dep)return {i,at:G.now>=st[i].arr}}return {i:st.length-1,at:true}}
function net(){return G.mode!=='train'||tp(G.train).at}
function present(){return trains.filter(tr=>tr.stops.some((s,i)=>s.name===G.station&&G.now>=s.arr&&G.now<s.dep&&i<tr.stops.length-1))}

  h+='<div class="blk"><h4>Before 3:30 class</h4>☐ Check route in Google Maps '+(G.openedMaps?'✓':'')+'<br>☐ Read the reading (Canvas)<div class="pb'+(G.parts===3?' ok':'')+'"><i data-live="read" style="width:'+(rp()*100)+'%"></i></div>☐ Quiz — answer & submit (Canvas)'+(G.quizDeadline?' <b style="color:#c0392b">due 3:25</b>':'')+'<div class="pb'+(G.submitted?' ok':'')+'"><i style="width:'+(G.submitted?100:ans/3*80)+'%"></i></div>☐ Reply to Mia (Messages)<div class="pb'+(G.sent?' ok':'')+'"><i style="width:'+(G.sent?100:(G.draft?50:0))+'%"></i></div></div><div class="mut">Downloading, submitting and sending need signal. Reading and answering work in the tunnel.</div>'}
 else if(G.app==='canvas'){t='Canvas · Urban Studies';
  if(!G.dl)h+='<div class="blk"><h4>Today\'s reading + quiz</h4>Read a part, answer its question — 3 rounds, then submit. Download once; it works offline.<button class="pbtn" data-do="dl"'+(busy?' disabled':'')+'>Download (needs signal)</button></div>';
  else{h+='<div class="blk"><b>Read '+G.parts+'/3 · Answered '+ans+'/3</b>'+(G.quizDeadline?' · <span style="color:#c0392b">due 3:25</span>':'')+'<div class="pb'+(G.submitted?' ok':'')+'"><i style="width:'+((G.parts+ans+(G.submitted?1:0))/7*100)+'%"></i></div></div>';
   for(let i=0;i<3;i++){
    if(i<G.parts){const q=QUIZ[i];h+='<div class="blk"><b>Part '+(i+1)+'</b><br>'+READING[i]+'</div><div class="blk" style="border-color:#e08a1e"><b>Q'+(i+1)+'.</b> '+q[0]+q[1].map((o,oi)=>'<button class="opt'+(G.answers[i]===oi?' sel':'')+'" data-q="'+i+'" data-o="'+oi+'"'+(G.submitted?' disabled':'')+'>'+o+'</button>').join('')+'</div>'}
    else if(i===G.parts){const can=ans>=G.parts;h+='<button class="pbtn" data-do="rd"'+(busy||!can?' disabled':'')+'>'+(can?'Read part '+(i+1):'Answer Q'+G.parts+' first')+'</button>'}}
   if(G.parts===3)h+=G.submitted?'<div class="mut">Quiz submitted '+hm(G.submitAt)+'.</div>':'<button class="pbtn" data-do="sb"'+(busy||ans<3?' disabled':'')+'>Submit quiz (needs signal)</button>'}}
 else if(G.app==='msg'){t='Messages · Mia';
  G.chat.forEach(m=>{h+='<div class="bub'+(m.out?' out':'')+'">'+m.text+'<div class="m">'+hm(m.t)+'</div></div>'});
  if(G.draft)h+='<div class="bub out" style="opacity:.6">'+G.draft+'<div class="m">'+(net()?'sending…':'waiting for signal…')+'</div></div>';
  else{const o=!G.replied?['Sure, I\'ll go first','Can you go first? I might be late','On the train, will update you']:(!G.chat[G.chat.length-1].out?['Almost there','Still on the way…','Train stopped again']:[]);
   h+='<div>'+o.map(x=>'<span class="chip" data-r="'+x.replace(/"/g,'&quot;')+'">'+x+'</span>').join('')+'</div>'}}
 else if(G.app==='mail'){t='Email';G.mail.forEach(m=>{h+='<div class="blk"><b>'+m.from+'</b> · <span class="mut">'+hm(m.t)+'</span><br><b>'+m.sub+'</b><br>'+m.text+'</div>'})}
 $('appT').textContent=t;$('appB').innerHTML=h;
 const D={dl:()=>start('download','Downloading',true),rd:()=>start('read','Reading part '+(G.parts+1),false),sb:()=>{if(G.partsAtQuiz===null)G.partsAtQuiz=G.parts;start('submit','Submitting quiz',true)}};
 $('appB').querySelectorAll('[data-do]').forEach(e=>e.onclick=D[e.dataset.do]);
 $('appB').querySelectorAll('[data-q]').forEach(e=>e.onclick=()=>{if(G.partsAtQuiz===null)G.partsAtQuiz=G.parts;if(!G.firstTask)G.firstTask='quiz';G.answers[+e.dataset.q]=+e.dataset.o;render(true)});
 $('appB').querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{if(G.action)return toast('One thing at a time.',1500);G.draft=e.dataset.r;start('send','Sending message',true)});
 if($('rep'))$('rep').onclick=()=>{G.reported++;render(true)};
}
function mapOptions(){
 if(G.mode==='end')return [];
 if(G.mode==='walk'&&G.walkTo==='Avery')return [{arr:G.walkUntil,lines:[],stops:[['Avery Hall','walking']]}];
 if(G.mode==='train'&&G.train.type==='local')return [{arr:stopOf(G.train,'116 St–Columbia').arr+360,lines:['1'],stops:[['Now: 1 Local',''],['116 St','walk 6 min']]}];
 if(G.mode==='train'&&G.train.type==='express'){const i96=G.train.stops.findIndex(s=>s.name==='96 St'),p=tp(G.train);
  if(p.i>i96)return [{arr:stopOf(G.train,'110 St–Central Park North').arr+1200,lines:[G.train.line],stops:[['110 St–CPN','missed 96 St'],['Avery Hall','walk 20 min']]}];
  const l2=nextAt('local','96 St',G.train.stops[i96].arr+30);return [{arr:l2?stopOf(l2.tr,'116 St–Columbia').arr+360:Infinity,lines:[G.train.line,'1'],stops:[['Now: '+G.train.line+' Express',''],['96 St','switch to 1'],['116 St','walk 6 min']]}]}
 let S,t,pre=[],pl=[];const Lst=['1 Av','3 Av','14 St–Union Sq'];
 if(G.mode==='walk'){S='14 St';t=G.walkUntil;pre=[['14 St','walking to 1/2/3']]}
 else if(G.mode==='train'&&G.train.type==='L'){S='14 St';t=G.train.stops[3].arr+240;pre=[['Now: L',''],['14 St','walk 4 min']];pl=['L']}
 else if(Lst.includes(G.station)){const nL=nextAt('L',G.station,G.now);S='14 St';t=nL?nL.tr.stops[3].arr+240:Infinity;pre=[[G.station,'L at '+(nL?hm(nL.s.dep):'—')],['14 St','walk 4 min']];pl=['L']}
 else{S=G.station;t=G.now;pre=[[S,'']]}
 const out=[],l=nextAt('local',S,t);
 if(l)out.push({arr:stopOf(l.tr,'116 St–Columbia').arr+360,lines:pl.concat(['1']),stops:pre.slice(0,-1).concat([[pre[pre.length-1][0],(pre[pre.length-1][1]?pre[pre.length-1][1]+' · ':'')+'1 at '+hm(l.s.dep)],['116 St','walk 6 min']])});
 if(XSTOP.has(S)&&S!=='96 St'){const x=nextAt('express',S,t);if(x){const l2=nextAt('local','96 St',stopOf(x.tr,'96 St').arr+30);if(l2)out.push({arr:stopOf(l2.tr,'116 St–Columbia').arr+360,lines:pl.concat([x.tr.line,'1']),stops:pre.slice(0,-1).concat([[pre[pre.length-1][0],(pre[pre.length-1][1]?pre[pre.length-1][1]+' · ':'')+x.tr.line+' at '+hm(x.s.dep)],['96 St','switch to 1 at '+hm(l2.s.dep)],['116 St','walk 6 min']])})}}
 return out.sort((a,b)=>a.arr-b.arr)}
function n2(){return net()}
// ---- intro + coach ----
function intro(){const f=$('full');f.style.display='flex';
 f.innerHTML='<div class="c"><div class="small">WEDNESDAY · 2:50 PM · 1 AV STATION (L)</div><h1>You\'re a Columbia student. Class starts at 3:30.</h1>'+
 '<p>Get from the East Village to <b>Avery Hall</b> on time — and finish the reading, submit the quiz, and answer your groupmate Mia on the way.</p><p>Your phone only has signal in stations. Start by checking your route in <b>Google Maps</b>.</p>'+
 '<button class="go2 pix" id="how">Show me how to play</button><button class="go2 pix alt" id="skipT">Skip tutorial</button></div>';
 $('how').onclick=()=>{f.style.display='none';coach(0)};$('skipT').onclick=()=>{f.style.display='none';begin()}}
function begin(){openApp('maps');G.paused=false;$('pauseBtn').textContent='❚❚ PAUSE';$('pauseBtn').classList.remove('paused')}
const STEPS=[
 {el:'phoneWrap',k:'1 / 6 · YOUR PHONE',t:'Start with <b>Google Maps</b>: it shows your route, how often each train runs, and a live ETA. You can report delays there too. <b>Notes</b> is your to-do list; <b>Canvas</b> has the reading and quiz; <b>Messages</b> and <b>Email</b> will ping you.'},
 {el:'strip',k:'2 / 6 · ROUTE MAP',t:'The yellow arrow is you. Big dots are express stops; the blue dot is 116 St–Columbia. On an express, the stops it skips go dark.'},
 {el:'cd',k:'3 / 6 · NEXT TRAINS',t:'On a platform, this board shows the next trains. When one arrives, the game pauses and asks: board or let it go?'},
 {el:'acts',k:'4 / 6 · ACTIONS',t:'Board, wait for the next train, or GET OFF are all down here. GET OFF lights up whenever the doors open.'},
 {el:'pauseBtn',k:'5 / 6 · PAUSE',t:'Pause any time. Delays, rats and crowds also pause the game with a pop-up so you can read what happened before deciding.'},
 {el:'clockBox',k:'6 / 6 · TIME',t:'Minutes left before class and your live ETA. Each ride has a 30% chance of a delay — where and what come from a year of real MTA service alerts.'}];
function coach(i){
 const c=$('coach');c.style.display='block';const s=STEPS[i],g=$('game').getBoundingClientRect(),e=$(s.el);
 if(s.el==='cd')e.style.display='block';const r=e.getBoundingClientRect();
 const h=$('hole');h.style.left=(r.left-g.left-4)+'px';h.style.top=(r.top-g.top-4)+'px';h.style.width=(r.width+8)+'px';h.style.height=(r.height+8)+'px';
 const b=$('bub');b.innerHTML='<div class="k">'+s.k+'</div>'+s.t+'<div class="row"><button id="cSkip">Skip</button><span>'+(i>0?'<button id="cBack">Back</button> ':'')+'<button class="hotb" id="cNext">'+(i===STEPS.length-1?'Start the commute':'Next')+'</button></span></div>';
 let bx=r.left-g.left,by=r.top-g.top+r.height+14;
 if(by+200>g.height)by=Math.max(8,r.top-g.top-210);
 if(s.el==='phoneWrap'){bx=r.left-g.left-326;by=r.top-g.top+40}
 bx=Math.min(Math.max(8,bx),g.width-322);b.style.left=bx+'px';b.style.top=by+'px';
 const done=()=>{c.style.display='none';begin()};
 $('cSkip').onclick=done;$('cNext').onclick=()=>i===STEPS.length-1?done():coach(i+1);if($('cBack'))$('cBack').onclick=()=>coach(i-1);
}
function end(){
 G.ended=true;render(true);
 const arr=G.arrival,late=arr===null||arr>DEADLINE,lm=arr?Math.ceil((arr-DEADLINE)/60):null;
 const correct=G.answers.filter((a,i)=>a===QUIZ[i][2]).length,subOK=G.submitted&&!(G.quizDeadline&&G.submitAt>G.quizDeadline),answered=G.answers.every(a=>a!==null);
 let e;
 if(G.overshoot)e=['Standing on Lenox Ave, staring at a map','You made it to 110th Street — just the wrong one.'];
 else if(late&&subOK&&correct===3)e=['Standing outside the classroom door','You knew every answer. You just missed the class.'];
 else if(late)e=['The whole class turns as you open the door','You spent the entire commute… completing a commute.'];
 else if(answered&&!subOK)e=['Your phone, stuck on the submit page','Your answers live on your phone. Your grade lives in your imagination.'];
 else if(!G.sent)e=['Mia slides the laptop over','“Okay then — you\'re presenting first.”'];
 else if(G.parts<3&&correct<2)e=['Phone under the desk','The professor is about to call on you. You\'re speed-summarizing with ChatGPT.'];
 else if(G.parts===3&&subOK&&correct===3)e=['Calmly flipping through your notes','You didn\'t just show up — your brain did too.'];
 else e=['Catching your breath in your seat','You made it. The rest is up to luck.'];
 const tot=G.done.length,cut=START+((arr||HARD)-START)*.75,ld=G.done.filter(d=>d.t>=cut).length,ev=[];
 if(G.letGo.length&&G.platformNet)ev.push(['Platform Office Worker','Let '+G.letGo.length+' train(s) go at '+G.letGo[0]+' to use the signal']);
 if(answered&&correct<=1)ev.push(['Confident Guesser','Answered every question, got '+correct+'/3 right']);
 if(G.firstTask==='send')ev.push(['Social First','Replying to Mia was the very first thing you did']);
 if(tot>=2&&ld/tot>=.5)ev.push(['Last-Minute Sprinter',ld+' of '+tot+' tasks done in the last quarter of the trip']);
 const P={'Platform Office Worker':'The subway platform is your coworking space.','Confident Guesser':'No question left unanswered.','Social First':'Everyone knows you\'re on your way — except your homework.','Last-Minute Sprinter':'Your potential shows up one minute before the deadline.','Steady Planner':'New York tried to throw you off. You already had a plan.'};
 const type=ev.length?ev[0][0]:'Steady Planner',facts=ev.map(x=>x[1]);facts.push(G.rodeExpress?'Rode an express, '+G.transfers+' transfer(s)':'Never touched an express');
 const evl=G.evs.map(x=>{const cnt=(EV[x.station]||{})[x.c]||0,rank=Object.values(EV).filter(v=>(v[x.c]||0)>cnt).length+1;
  return (x.line==='L'?'L train':x.line+' train')+' at '+x.station+': '+EVNAME[x.c]+', about '+x.mins+' min lost. <span class="small">('+cnt+' such alerts there last year, #'+rank+' on this route)</span>'});
 const f=$('full');f.style.display='flex';
 f.innerHTML='<div class="c"><h1>'+e[1]+'</h1><div class="small">Scene: '+e[0]+'</div>'+
 '<h2>GOOGLE SAID vs WHAT HAPPENED</h2><div class="cmp"><div><div class="small">Google estimate</div><div class="n">3:28</div></div><div><div class="small">You walked in at</div><div class="n '+(late?'late':'ontime')+'">'+(arr?hm(arr):'—')+'</div><div class="small">'+(arr?(late?lm+' min late':'On time'):'Still not there at 3:50')+'</div></div></div>'+
 '<h2>TASKS</h2><div>Reading '+G.parts+'/3 · Quiz '+(G.submitted?(subOK?'submitted':'submitted late'):(answered?'answered, not submitted':'unfinished'))+', '+correct+'/3 correct · Mia '+(G.sent?'replied':'no reply')+(G.reported?' · You reported a delay':'')+'</div>'+
 '<h2>ON THE WAY</h2><div>'+(evl.length?evl.join('<br>'):'No major delay this time.')+(G.rat?'<br>A rat at '+G.rat+'.':'')+(G.crowdDone?'<br>Squeezed by a crowd.':'')+'</div>'+
 '<h2>YOUR COMMUTE PERSONALITY</h2><div style="font-size:18px"><b>'+type+'</b> — '+P[type]+'</div><div class="small">'+facts.slice(0,2).join(' · ')+'</div>'+
 '<p class="small" style="margin-top:12px">Each ride in the game has a 30% chance of a major delay (turned up to make it playable). In reality about 11% of 1 train trips and 16% of 2 train trips run 5+ minutes late. Locations and types come from real MTA service alerts.</p>'+
 '<button class="go2 pix" id="again">Ride again</button></div>';
 $('again').onclick=newGame}
document.querySelectorAll('.hot').forEach(h=>h.onclick=()=>openApp(h.dataset.app));
$('bk').onclick=()=>{G.app=null;render(true)};
$('pauseBtn').onclick=()=>{if(G.ended||G.modal)return;G.paused=!G.paused;$('pauseBtn').textContent=G.paused?'▶ RESUME':'❚❚ PAUSE';$('pauseBtn').classList.toggle('paused',G.paused)};
newGame();setInterval(tick,100);
</script>
